<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samurai Bot Panel</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Sawarabi+Mincho&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-overlay" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Access Restricted</h2>
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label>Panel Secret</label>
                    <input type="password" id="panel-password" placeholder="Enter password" required>
                </div>
                <button type="submit" class="btn btn-red btn-full">Unlock Panel</button>
            </form>
        </div>
    </div>

    <div class="container hidden" id="main-container">
        <header>
            <h1><i class="fas fa-torii-gate"></i> SAMURAI PANEL</h1>
            <p>Master your bots with honor.</p>
        </header>

        <main>
            <section id="bot-list-section">
                <div class="section-header">
                    <h2><i class="fas fa-scroll"></i> Your Bots</h2>
                    <button id="show-upload-btn" class="btn btn-gold"><i class="fas fa-plus"></i> New Bot</button>
                </div>
                <div id="bot-list" class="bot-grid">
                    <!-- Bots will be loaded here -->
                </div>
            </section>

            <section id="management-section" class="hidden">
                <div class="section-header">
                    <h2 id="current-bot-name">Bot Name</h2>
                    <div class="controls">
                        <button id="start-btn" class="btn btn-green"><i class="fas fa-play"></i> Start</button>
                        <button id="stop-btn" class="btn btn-red"><i class="fas fa-stop"></i> Stop</button>
                        <button id="restart-btn" class="btn btn-gold"><i class="fas fa-redo"></i> Restart</button>
                        <button id="back-btn" class="btn btn-gray"><i class="fas fa-arrow-left"></i> Back</button>
                    </div>
                </div>

                <div class="console-wrapper">
                    <div class="console-header">
                        <span><i class="fas fa-terminal"></i> Console</span>
                        <button id="clear-console" class="btn-text">Clear</button>
                    </div>
                    <div id="console" class="console-output"></div>
                </div>
            </section>

            <!-- Upload Modal -->
            <div id="upload-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Forge New Bot</h2>
                        <span class="close-modal">&times;</span>
                    </div>
                    <form id="upload-form">
                        <div class="form-group">
                            <label>Bot Name</label>
                            <input type="text" name="name" placeholder="E.g. WhatsApp Warrior" required>
                        </div>
                        <div class="form-group">
                            <label>Main Script File</label>
                            <input type="text" name="main" placeholder="index.js" value="index.js" required>
                        </div>
                        <div class="form-group">
                            <label>Script Files (.zip or single .js)</label>
                            <input type="file" name="file" required>
                        </div>
                        <button type="submit" class="btn btn-red btn-full">Assemble Bot</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
